# Cargo workspace for the three Rust front-ends.
#
# All Rust apps share the same framework-agnostic core (`fm-core`: domain,
# application and infrastructure layers) and a small presentation kit
# (`fm-ui-kit`: design tokens, glyphs, formatters). Each app only implements
# its own presentation layer, so the comparison between toolkits is fair.
[workspace]
resolver = "3"
members = [
    "libs/rust/fm-core",
    "libs/rust/fm-ui-kit",
    "apps/rust-iced",
    "apps/rust-egui",
    "apps/rust-slint",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
fm-core = { path = "libs/rust/fm-core" }
fm-ui-kit = { path = "libs/rust/fm-ui-kit" }
thiserror = "2.0"
dirs = "7.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
# `deny` rather than `forbid`: Slint-generated code locally re-allows it.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
